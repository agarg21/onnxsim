name: Formal models (ROS2 discovery)

on:
  pull_request:
    paths:
      - "tools/onnx-remote/formal/**"
      - "tools/onnx-remote/ros2_bridge.cpp"
      - ".github/workflows/formal-ros-discovery.yml"
  push:
    branches: [main, master]
    paths:
      - "tools/onnx-remote/formal/**"
      - "tools/onnx-remote/ros2_bridge.cpp"
      - ".github/workflows/formal-ros-discovery.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tlc:
    name: TLC model checks (RosDiscoveryLease)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Pinned TLA+ tools release (v1.7.4) and its sha256. Bump both together.
      TLA2TOOLS_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check generated parameters are current
        run: python3 tools/onnx-remote/formal/gen_params.py --check
      - name: Fetch TLA+ tools
        run: |
          curl -sSfL -o "${RUNNER_TEMP}/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "${TLA2TOOLS_SHA256}  ${RUNNER_TEMP}/tla2tools.jar" | sha256sum -c -
      - name: Run TLC on each config
        env:
          TLA2TOOLS_JAR: ${{ runner.temp }}/tla2tools.jar
        run: python3 tools/onnx-remote/formal/run_tlc.py
