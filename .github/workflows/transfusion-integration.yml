# Weekly run of the TransFusion ONNX Runtime integration test
# (tests/test_transfusion_integration.py): builds onnxsim from source, then runs
# the test against it. The schedule keeps the check running after the PR that
# added it merges; workflow_dispatch runs it on demand.
name: TransFusion integration

on:
  schedule:
    - cron: '56 8 * * 1'  # Mondays 08:56 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfusion_integration:
    name: TransFusion ONNX Runtime integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build and install onnxsim
        run: python -m pip install -v .
      - name: Install test deps
        run: python -m pip install pytest onnxruntime
      # Run from a neutral directory so the repo's own ./onnxsim/ source package
      # cannot shadow the installed wheel (same approach as build-and-test.yml's
      # formal verification job).
      - name: Run integration test
        working-directory: ${{ runner.temp }}
        run: python -m pytest "$GITHUB_WORKSPACE/tests/test_transfusion_integration.py" -v
